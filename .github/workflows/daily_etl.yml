name: Fantacalcio Ingestion

on:

  workflow_dispatch:

  schedule:
    - cron: "0 4 * * *"

jobs:

  ingestion:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:

      FANTACALCIO_USERNAME: ${{ secrets.FANTACALCIO_USERNAME }}
      FANTACALCIO_PASSWORD: ${{ secrets.FANTACALCIO_PASSWORD }}

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r ingestion/requirements.txt

      - name: Run Fantacalcio ingestion
        run: |
          python ingestion/fantacalcio_ingestion.py

      - name: Commit downloaded Excel files
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Nessun nuovo file da committare"
          else
            git commit -m "Update Fantacalcio historical data"
            git push
          fi
