name: Daily API-Football ETL Ingestion

on:
  schedule:
    # Esegue automaticamente ogni giorno alle 04:00 UTC (6:00 italiane)
    - cron: '0 4 * * *'
  # Permette anche di lanciare l'ETL manualmente dalla scheda Actions di GitHub
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas supabase

    - name: Run ETL Ingestion Script
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      run: |
        python etl_ingestion.py
