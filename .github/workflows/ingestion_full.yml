name: Ingestion FBref - FULL (storico)

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Numero di stagioni storiche da scaricare"
        required: false
        default: "5"

jobs:
  full-ingestion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Chrome (necessario per FBref/Selenium)
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          N_SEASONS: ${{ github.event.inputs.seasons }}
        run: python etl_ingestion_full.py
