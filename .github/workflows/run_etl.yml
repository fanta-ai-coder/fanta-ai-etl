name: Exec ETL FantaAI

on:
  schedule:
    # Esegue lo script in automatico ogni lunedì alle 04:00 AM (UTC)
    - cron: '0 4 * * 1'
  workflow_dispatch: # Ti permette di avviare l'automazione manualmente con un click quando vuoi

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python etl_fanta_ai.py 
